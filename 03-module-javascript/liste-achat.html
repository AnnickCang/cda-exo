<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liste achats</title>
    <link rel="stylesheet" href="css/liste-achat.css" />
    <script type="text/javascript" src="js/jquery.js"></script>
    <script src="js/liste-achat.js" defer></script>
  </head>
  <body>
    <main>
      <section class="card">
        <img src="img/chat2.png" alt="Image" id="image" />
      </section>
      <section class="card">
        <div id="produit">
          <h1 id="nomProduit"></h1>
          <div>
            <button type="button" class="btnProduit" id="btnPrec"><</button>
            <button type="button" class="btnProduit" id="btnSuiv">></button>
          </div>
        </div>
        <h2 id="prixProduit"></h2>
        <button type="button" id="btnDetails">Afficher les détails</button>
        <p id="details"></p>
        <hr />
        <div id="panier">
          <label>Quantité</label>
          <input type="number" value="0" id="quantite" />
          <button type="button" id="btnAjouter">Ajouter au panier</button>
        </div>
        <p id="info-panier"></p>
      </section>
    </main>
  </body>
</html>
